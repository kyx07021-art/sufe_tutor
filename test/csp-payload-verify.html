<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 与 web/index.html 完全同源的严格 meta CSP（V-3-1d2，h5a-g6 收紧 style-src-attr 'none'）——验证四类注入面的真实浏览器拦截语义 -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src-elem 'self'; style-src-attr 'none'">
  <title>CSP 注入面验证页（V-3-1e）</title>
</head>
<body>
  <!-- 第一路：内联 script（应被 script-src 'self' 拦，__csp_inline 不得置位） -->
  <script>window.__csp_inline = 1;</script>

  <!-- 第二路：内联事件 handler（应被 script-src 拦，点击后 __csp_onclick 不得置位） -->
  <button id="csp-onclick" onclick="window.__csp_onclick = 1">点我</button>

  <!-- 第三路：<style> 元素注入（应被 style-src-elem 'self' 拦，.csp-elem-test 不得生效） -->
  <style>.csp-elem-test{color:rgb(1,2,3)}</style>
  <div id="csp-elem" class="csp-elem-test">style 元素注入面</div>

  <!-- 第四路（h5a-g6 起为拦截面）：HTML style 属性（受 style-src-attr 管辖，现 'none' 应收拦）——计算色必须非 rgb(9,8,7)；
       CSSOM cssText/setProperty 不受此指令管辖（F1 实测定案），app 生产代码零内联 style 属性 -->
  <div id="csp-attr" style="color:rgb(9,8,7)">style 属性</div>
</body>
</html>
