<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- V-3-1d2 严格 meta CSP：最小化声明（无 default-src——防交集收紧 _headers 的 img-src data:/blob: 与 font-src）。
       script-src/style-src-elem 无 unsafe-inline（拦内联 script/<style> 元素）；style-src-attr 'unsafe-inline'
       留 CSSOM 自定义属性数据通道（c1/c2 的 --lg-*/--ui-rf-transform）。多策略交集只收紧双方都声明的指令。 -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'">
  <title>经途·伴学信息门户 - 零佣金家教信息共享平台</title>
  <script src="/theme-init.js"></script>
  <!-- V-2-5b CSS 重组：tokens → base → features → responsive → glass（层叠顺序同 v1） -->
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/features/complaints.css">
  <link rel="stylesheet" href="/features/browse.css">
  <link rel="stylesheet" href="/features/admin.css">
  <link rel="stylesheet" href="/features/teacher.css">
  <link rel="stylesheet" href="/features/notif.css">
  <link rel="stylesheet" href="/features/chart.css">
  <link rel="stylesheet" href="/features/demand.css">
  <link rel="stylesheet" href="/responsive.css">
  <!-- 域样式异步化（V-3-1b）：data-async-css 由 /async-css.js 在加载后切 all，零内联事件属性 -->
  <link rel="stylesheet" href="/features/chat.css" media="print" data-async-css>
  <link rel="stylesheet" href="/features/posts.css" media="print" data-async-css>
  <link rel="stylesheet" href="/features/region.css" media="print" data-async-css>
  <link rel="stylesheet" href="/glass.css">
  <script src="/async-css.js"></script>
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
