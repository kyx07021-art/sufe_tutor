<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher-card geometry harness</title>
    <style>
      /* Test-only layout: a fixed-width two-column grid so TeacherCard geometry
         is deterministic (the real grid lives in CardGrid.vue / the page). */
      .grid {
        width: 920px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        padding: 16px;
      }
      .cell {
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./harness-teacher-card.js"></script>
  </body>
</html>
