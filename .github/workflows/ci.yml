# 网安报告 F-09：自动化测试门禁 —— 哈希链 / 密码学 / 脱敏 / 分页回归
# 每次 push 跑 node --test（无外部依赖，纯 Node 内置 test runner）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
